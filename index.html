<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Live Events</title><style>@keyframes heartbeat{0%{transform:scale(1);box-shadow:0 0 10px rgba(255,215,0,.5)}50%{transform:scale(1.02);box-shadow:0 0 20px rgba(255,215,0,.8)}100%{transform:scale(1);box-shadow:0 0 10px rgba(255,215,0,.5)}}@keyframes livePulse{0%{transform:scale(1);opacity:1}50%{transform:scale(1.2);opacity:.7}100%{transform:scale(1);opacity:1}}@keyframes pulse{0%{transform:scale(1);box-shadow:0 0 10px rgba(255,0,0,.5)}50%{transform:scale(1.05);box-shadow:0 0 20px rgba(255,0,0,.8)}100%{transform:scale(1);box-shadow:0 0 10px rgba(255,0,0,.5)}}body{font-family:Arial,sans-serif;text-align:center;background:#121212;color:#fff;padding:20px}.poster{background:red;border-radius:20px;padding:15px 20px;margin-bottom:25px;box-shadow:0 0 20px rgba(255,0,0,.6);font-size:20px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:1.5px;width:260px;margin:0 auto 30px auto;animation:pulse 2s infinite;cursor:pointer}.event-container{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}.event{width:400px;background:#222;border-radius:12px;overflow:hidden;position:relative;padding-bottom:15px;animation:heartbeat 3s infinite;transition:transform .3s}.event:hover{transform:scale(1.03)}.event img{width:100%;height:220px;object-fit:cover;border-top-left-radius:12px;border-top-right-radius:12px}.event-content{padding:15px}.title{font-size:18px;font-weight:700;color:#fff;margin-bottom:5px}.league{font-size:14px;color:#bbb;margin-bottom:10px}.buttons{display:flex;flex-direction:column;gap:10px;margin-top:15px}.watch-btn{display:block;width:90%;padding:12px;background:transparent;color:#fff;text-decoration:none;border:2px solid gold;border-radius:8px;font-size:16px;font-weight:700;margin:0 auto;text-align:center;transition:all .3s ease-in-out}.watch-btn:hover{background:gold;color:#000;transform:scale(1.1);box-shadow:0 0 25px gold}.live-badge{position:absolute;top:10px;left:10px;background:red;color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:5px;animation:livePulse 1.5s infinite}</style></head><body><div class="poster" onclick="window.open('https://t.me/+3DeWZl3UhKgxMDI1','_blank')">Cric News Point</div><div class="event-container" id="events"></div><script>async function fetchEvents(){try{const e=await fetch("https://raw.githubusercontent.com/drmlive/fancode-live-events/refs/heads/main/fancode.json"),t=await e.json(),n=document.getElementById("events");n.innerHTML="",t.matches.forEach(e=>{const t=document.createElement("div");t.classList.add("event");let a=new Date(e.startTime),r=a.toLocaleDateString(),o=a.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),c="LIVE"===e.status,l=e.dai_url?`https://cricnewspoints.netlify.app?url=${e.dai_url}`:"#";t.innerHTML=`<img src="${e.src}" alt="${e.title}">${c?`<div class="live-badge">LIVE</div>`:""}<div class="event-content"><div class="title">${e.title}</div><div class="league">${e.event_name}</div><div class="buttons">${e.dai_url?`<a href="${l}" target="_blank" class="watch-btn">Watch Now</a>`:""}${e.dai_url?`<a href="${l}" target="_blank" class="watch-btn">Ad-Free</a>`:""}</div></div>`,n.appendChild(t)})}catch(e){console.error("Error fetching events:",e)}}fetchEvents();</script></body></html>
